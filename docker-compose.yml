services:
  postgres:
    image: postgres:16-alpine
    container_name: opsflow-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-opsflow_dev}
    ports:
      # Bound to loopback only, and to a non-default port, so this never
      # collides with (or is reachable like) any other PostgreSQL instance
      # on the host. This is a local-development-only database.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - opsflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-opsflow} -d ${POSTGRES_DB:-opsflow_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opsflow_postgres_data:
    name: opsflow_postgres_data_dev
